[package]
name = "example"
version.workspace = true
edition.workspace = true
authors.workspace = true

[[bin]]
name = "basic"
path = "src/main.rs"

[[bin]]
name = "planet_chunk_sphere"
path = "src/bin/planet_chunk_sphere.rs"

[[bin]]
name = "test_chunk_gaps"
path = "src/bin/test_chunk_gaps.rs"

[dependencies]
engine = { version = "0.1.0", path = "../engine" }
voxel = { version = "0.1.0", path = "../voxel" }
bevy = "0.17.2"  # Updated to match bevy_brp_extras version
bevy_remote = "0.17.2"  # Core BRP support
bevy_brp_extras = "0.17.0"  # Screenshots, keyboard input, etc.
# Note: bevy_debugger_mcp is an external MCP server, not a Bevy plugin dependency
